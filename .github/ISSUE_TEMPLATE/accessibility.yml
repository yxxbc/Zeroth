name: Accessibility barrier
description: The interface got in the way — screen reader, contrast, motion, keyboard.
title: "accessibility: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        `ACCESSIBILITY.md` lists what can already be turned off and the barriers
        known to be open. A report against either is a bug — see that page.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of barrier
      options:
        - screen reader / text output
        - colour or contrast
        - motion / animation
        - keyboard only
        - size / layout at a small or large terminal
        - something else
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: Which part of the interface, and what it did instead of what you needed.
    validations:
      required: true
  - type: textarea
    id: worked-around
    attributes:
      label: What you tried
      description: A switch you turned off, a different theme, `--inline` — anything that helped or did not.
  - type: input
    id: platform
    attributes:
      label: OS, terminal and assistive technology
      placeholder: macOS 26.2, iTerm2, VoiceOver
