name: Feature request
description: Propose a change in behaviour before agreeing a design.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project designs before it implements (`CONTRIBUTING.md`): an
        issue is where the shape gets agreed, and `docs/` gets the page once
        it is. A small, obvious fix needs no issue.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation you are in, not the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" — it is a real option.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / rendering
        - input, keys and composer
        - providers, models and sign-in
        - tools (bash, files, web, agents, tasks)
        - state (resume, checkpoints, permissions, settings)
        - CLI / headless
        - release, docs or developer tooling
        - not sure
